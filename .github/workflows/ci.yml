name: QuickCart CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Code Quality & Automated Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: quickcart_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Validate Prisma schema definition
        run: npm run prisma:validate

      - name: Generate Prisma ORM Client
        run: npx prisma generate

      - name: Run ESLint linter
        run: npm run lint

      - name: Run automated tests with coverage
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/quickcart_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: quickcart_ci_test_dummy_jwt_access_secret_super_long_key_12345
          JWT_REFRESH_SECRET: quickcart_ci_test_dummy_jwt_refresh_secret_super_long_key_67890
          LOG_LEVEL: silent
        run: npm run test:coverage -- --runInBand

      - name: Upload test coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-build-verification:
    name: Container Build & Packaging Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: quickcart-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
