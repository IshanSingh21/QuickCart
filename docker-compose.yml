services:
  postgres:
    image: postgres:16-alpine
    container_name: quickcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quickcart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quickcart_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-quickcart_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quickcart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quickcart_user} -d ${POSTGRES_DB:-quickcart_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quickcart-net

  redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - quickcart_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quickcart-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickcart-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-quickcart_user}:${POSTGRES_PASSWORD:-quickcart_secret_password}@postgres:5432/${POSTGRES_DB:-quickcart_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-quickcart_compose_jwt_access_secret_super_long_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-quickcart_compose_jwt_refresh_secret_super_long_32_chars}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - quickcart-net

volumes:
  quickcart_pgdata:
    name: quickcart_pgdata
  quickcart_redisdata:
    name: quickcart_redisdata

networks:
  quickcart-net:
    name: quickcart-net
    driver: bridge
